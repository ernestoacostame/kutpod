server {
    listen 8080 default_server;
    server_name _;

    root /var/www/html;
    index site.php index.php;
    charset utf-8;

    client_max_body_size 2048M;

    # Proteger directorios y archivos internos
    location ~ ^/(pages|includes|api/handlers|public|Docker)/ {
        deny all;
        return 404;
    }
    location ~ ^/cli/(?!install\.php) {
        deny all;
        return 404;
    }
    location ~ ^/storage/(?!media/) {
        deny all;
        return 404;
    }
    location ~* ^/storage/media/.*\.(php[0-9]?|phtml|phar|pl|py|cgi|sh)$ {
        deny all;
        return 404;
    }
    location ~ /\.(?!well-known) {
        deny all;
        return 404;
    }

    # Media con soporte de Range para audio/vídeo
    location ^~ /storage/media/ {
        access_log off;
        add_header Accept-Ranges bytes;
        expires 30d;
        try_files $uri =404;
    }

    # Instalador
    rewrite ^/install/?$ /cli/install.php last;

    # Tracker OP3 nativo
    rewrite ^/r/([^/]+)/([^/]+)(?:/.*)?$ /r.php?show=$1&ep=$2 last;

    # SEO dinámico
    rewrite ^/robots\.txt$ /robots-sitemap.php?type=robots last;
    rewrite ^/sitemap\.xml$ /robots-sitemap.php?type=sitemap last;

    # Feeds RSS
    rewrite ^/feed/([a-zA-Z0-9\-]+)\.xml$ /feed.php?slug=$1 last;
    rewrite ^/feed\.xml$ /feed.php?slug=all last;

    # API REST
    rewrite ^/api/(.*)$ /api/index.php?route=$1 last;

    # ActivityPub
    rewrite ^/\.well-known/webfinger$ /activitypub.php?ap=webfinger last;
    rewrite ^/users/([a-zA-Z0-9\-]+)/?$ /activitypub.php?ap=actor&slug=$1 last;
    rewrite ^/users/([a-zA-Z0-9\-]+)/(inbox|outbox|followers|notes/[^/]+)/?$ /activitypub.php?ap=$2&slug=$1 last;

    # Panel admin
    rewrite ^/admin/?$ /index.php last;
    rewrite ^/admin/login-2fa/?$ /index.php?page=login-2fa last;
    rewrite ^/admin/([a-z0-9\-]+)/?$ /index.php?page=$1 last;
    rewrite ^/admin/podcast/([a-zA-Z0-9\-]+)/?$ /index.php?page=podcast&id=$1 last;
    rewrite ^/admin/podcast/([a-zA-Z0-9\-]+)/edit/?$ /index.php?page=edit-podcast&id=$1 last;

    # Sitio público y embeds
    location ^~ /embed {
        add_header Content-Security-Policy "frame-ancestors *" always;
        add_header Access-Control-Allow-Origin "*" always;
        rewrite ^/embed/@([a-zA-Z0-9\-]+)/([a-zA-Z0-9\-]+)/?$ /site.php?r=embed&show=$1&ep=$2 last;
        rewrite ^/embed/([a-zA-Z0-9\-]+)/?$ /site.php?r=embed&ep=$1 last;
    }

    rewrite ^/@([a-zA-Z0-9\-]+)/?$ /site.php?r=show&id=$1 last;
    rewrite ^/@([a-zA-Z0-9\-]+)/([a-zA-Z0-9\-]+)/?$ /site.php?r=episode&show=$1&ep=$2 last;
    rewrite ^/shows/?$ /site.php?r=shows last;
    rewrite ^/episodes/?$ /site.php?r=episodes last;
    rewrite ^/p/([a-zA-Z0-9\-]+)/?$ /site.php?r=page&id=$1 last;

    # Raíz y fallback
    location = / {
        rewrite ^ /site.php last;
    }

    location / {
        try_files $uri $uri/ /site.php?r=home&$query_string;
    }

    # Estáticos
    location ~* \.(css|js|webp|jpg|jpeg|png|gif|svg|woff|woff2|ico)$ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass 127.0.0.1:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 300;
        fastcgi_send_timeout 300;
    }
}
